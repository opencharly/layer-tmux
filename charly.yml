tmux:
    candy:
        description: |
            Terminal multiplexer providing persistent, detachable terminal sessions inside containers
            The tmux candy installs the tmux package (same name on RPM, DEB, and PAC
            distros) so the binary lands at /usr/bin/tmux. tmux is the multiplexer
            used by Charly's typed terminal provider: it starts isolated detached session
            servers with no controlling TTY and lets sessions outlive disconnects. It is verifiable by
            asserting the binary exists, the package is registered, the version banner
            prints, and a real detached session can be created, confirmed live, and killed.
        package:
            - tmux
        plan:
            - check: the tmux multiplexer binary is installed at /usr/bin/tmux
              file:
                file: /usr/bin/tmux
                exists: true
            - check: the tmux package is registered with the system package manager
              package:
                package: tmux
                installed: true
            - check: invoking tmux -V exits cleanly and prints a tmux version banner
              exit_status: 0
              stdout:
                - matches: "^tmux"
              command: /usr/bin/tmux -V
            - check: tmux starts a detached session with no TTY, confirms it is live, then tears it down
              exit_status: 0
              command: tmux new-session -d -s charly-ade-probe && tmux has-session -t charly-ade-probe && tmux kill-session -t charly-ade-probe

# ---------------------------------------------------------------------------
# The verb/schema skills this repo's own candy owns — routing only.
#
# Each node carries `name`/`family`/`owner` (plus `triggers:` where the skill
# generates DISPATCHER.md rows). The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:`
# or `content:` — an inline body that disagrees with its file is a hard error
# in the marketplace generator. `family:` is the marketplace family the skill
# was authored under, kept so every existing `/charly-<family>:<name>` address
# still resolves; `owner:` names the candy whose command/kind surface the
# skill documents. This candy composes no image, so these nodes add nothing to
# any `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
tmux-layer-skill:
  skill:
    name: tmux-layer
    family: infrastructure
    owner: tmux
